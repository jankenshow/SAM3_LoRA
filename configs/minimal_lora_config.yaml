model:
  checkpoint_path: weights/sam3.pt
  allow_download: false
lora:
  rank: 4
  alpha: 8
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  apply_to_vision_encoder: false
  apply_to_text_encoder: false
  apply_to_geometry_encoder: false
  apply_to_detr_encoder: false
  apply_to_detr_decoder: true
  apply_to_mask_decoder: false
training:
  num_negatives: 3
  batch_size: 8
  num_workers: 4
  learning_rate: 2e-4
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  max_grad_norm: 1.0
  num_epochs: 5
  warmup_steps: 100
  lr_scheduler: cosine
  mixed_precision: fp16
  seed: 42
  gradient_accumulation_steps: 1
  data_dir: data
output:
  output_dir: outputs/sam3_lora_minimal
hardware:
  find_unused_parameters: true
