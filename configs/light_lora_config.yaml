model:
  checkpoint_path: weights/sam3.pt
  allow_download: false
lora:
  rank: 16
  alpha: 32
  dropout: 0.1
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - out_proj
  apply_to_vision_encoder: false
  apply_to_text_encoder: false
  apply_to_geometry_encoder: false
  apply_to_detr_encoder: true
  apply_to_detr_decoder: true
  apply_to_mask_decoder: true
training:
  data_dir: data
  num_negatives: 3
  batch_size: 2
  num_workers: 2
  learning_rate: 1e-4
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  max_grad_norm: 1.0
  num_epochs: 100
  warmup_steps: 200
  lr_scheduler: cosine
  mixed_precision: bf16
  seed: 42
  gradient_accumulation_steps: 8
output:
  output_dir: outputs/sam3_lora_light
hardware:
  find_unused_parameters: true
