model:
  checkpoint_path: weights/sam3.pt
  allow_download: false
lora:
  rank: 16
  alpha: 32
  dropout: 0.1
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - out_proj
  - fc1
  - fc2
  - qkv
  apply_to_vision_encoder: true
  apply_to_text_encoder: false
  apply_to_geometry_encoder: false
  apply_to_detr_encoder: false
  apply_to_detr_decoder: false
  apply_to_mask_decoder: true
training:
  batch_size: 1
  num_workers: 4
  num_negatives: 3
  generic_negatives:
  - car
  - person
  - dog
  - cat
  - bicycle
  - bird
  - bottle
  - phone
  - chair
  - table
  - flower
  learning_rate: 1e-4
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  max_grad_norm: 1.0
  num_epochs: 50
  warmup_steps: 100
  lr_scheduler: cosine
  mixed_precision: bf16
  seed: 42
  gradient_accumulation_steps: 2
  data_dir: data
output:
  output_dir: outputs/crack_detection_lora
hardware:
  find_unused_parameters: true
