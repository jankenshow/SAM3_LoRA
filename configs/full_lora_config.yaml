model:
  checkpoint_path: weights/sam3.pt
  allow_download: false
lora:
  rank: 32
  alpha: 64
  dropout: 0.1
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - out_proj
  - qkv
  - proj
  - fc1
  - fc2
  - c_fc
  - c_proj
  - linear1
  - linear2
  apply_to_vision_encoder: true
  apply_to_text_encoder: false
  apply_to_geometry_encoder: true
  apply_to_detr_encoder: true
  apply_to_detr_decoder: true
  apply_to_mask_decoder: true
training:
  data_dir: data
  batch_size: 4
  num_workers: 2
  num_negatives: 3
  data_format: coco
  prompt_source: auto
  mix_class_prompt: false
  use_full_caption: true
  num_cross_negatives: 2
  learning_rate: 5e-5
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  max_grad_norm: 1.0
  num_epochs: 100
  warmup_steps: 200
  lr_scheduler: cosine
  mixed_precision: bf16
  seed: 42
  gradient_accumulation_steps: 8
output:
  output_dir: outputs/sam3_lora_full
hardware:
  find_unused_parameters: true
