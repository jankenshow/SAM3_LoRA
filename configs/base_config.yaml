model:
  checkpoint_path: weights/sam3.pt
  allow_download: false
lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  target_modules:
  - q_proj
  - k_proj
  - v_proj
  - out_proj
  - qkv
  apply_to_vision_encoder: true
  apply_to_text_encoder: false
  apply_to_geometry_encoder: false
  apply_to_detr_encoder: true
  apply_to_detr_decoder: true
  apply_to_mask_decoder: false
training:
  num_negatives: 3
  data_format: coco
  prompt_source: auto
  mix_class_prompt: false
  use_full_caption: true
  num_cross_negatives: 2
  batch_size: 1
  num_workers: 0
  learning_rate: 1e-4
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1e-8
  max_grad_norm: 1.0
  num_epochs: 10
  warmup_steps: 0
  lr_scheduler: cosine
  mixed_precision: 'no'
  seed: 42
  gradient_accumulation_steps: 1
  data_dir: data
output:
  output_dir: outputs/sam3_lora
hardware:
  find_unused_parameters: true
