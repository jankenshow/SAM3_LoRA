[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam3-lora"
version = "0.4.0"
description = "Structured LoRA training, inference and evaluation for SAM3"
readme = "README.md"
license-files = ["licenses/SAM3_LICENSE"]
requires-python = ">=3.12"
dependencies = [
  "torch>=2.7", "torchvision>=0.22", "numpy>=1.26", "Pillow>=10",
  "PyYAML>=6", "pycocotools>=2.0.6", "tqdm>=4.65",
]

[project.optional-dependencies]
runtime = [
  "huggingface-hub>=0.26", "iopath>=0.1.10", "timm>=1.0", "ftfy>=6.1",
  "regex", "einops>=0.6", "scipy>=1.10", "hydra-core>=1.3", "omegaconf>=2.3",
  "decord>=0.6", "psutil>=5.9", "typing-extensions>=4.12", "opencv-python>=4.8",
  "scikit-image>=0.21", "scikit-learn>=1.3", "tensordict>=0.6",
  "triton; platform_system == 'Linux' and platform_machine == 'x86_64'",
]
experiment = ["matplotlib>=3.7", "pandas>=1.5", "submitit>=1.4", "transformers>=4.48"]
dev = ["ruff>=0.14", "build>=1.2"]

[project.scripts]
sam3-lora = "sam3_lora.cli.main:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = [".", "vendor/sam3"]
include = ["sam3_lora*", "sam3", "sam3.*"]
exclude = ["expt*", "tests*", "tools*"]
namespaces = true

[tool.setuptools.package-data]
sam3 = ["assets/*.gz", "train/configs/**/*.yaml"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["vendor", "expt", "docs/archive", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
